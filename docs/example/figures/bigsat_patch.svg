<?xml version="1.0" encoding="UTF-8"?>
<!-- Mission patch of BigSat, an imaginary satellite used by the sphinx2word example. Drawn for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3b2a6e"/>
      <stop offset="1" stop-color="#140f33"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80c4"/>
      <stop offset="1" stop-color="#16467a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c7bd9"/>
      <stop offset="1" stop-color="#2c3f8f"/>
    </linearGradient>
    <clipPath id="inner">
      <circle cx="300" cy="300" r="236"/>
    </clipPath>
  </defs>

  <!-- Outer band -->
  <circle cx="300" cy="300" r="292" fill="#f2a71b"/>
  <circle cx="300" cy="300" r="282" fill="#1b1a3a"/>
  <circle cx="300" cy="300" r="240" fill="#f2a71b"/>

  <g clip-path="url(#inner)">
    <!-- Sky and stars -->
    <rect x="0" y="0" width="600" height="600" fill="url(#sky)"/>
    <g fill="#ffffff">
      <circle cx="170" cy="170" r="3"/>
      <circle cx="420" cy="150" r="2.5"/>
      <circle cx="455" cy="250" r="2"/>
      <circle cx="140" cy="260" r="2"/>
      <circle cx="250" cy="120" r="2"/>
      <circle cx="350" cy="110" r="1.8"/>
      <circle cx="205" cy="330" r="1.8"/>
      <circle cx="480" cy="330" r="2.2"/>
      <path d="M 380 200 l 5 15 l 15 5 l -15 5 l -5 15 l -5 -15 l -15 -5 l 15 -5 z"/>
      <path d="M 120 205 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 z"/>
    </g>

    <!-- The Sun, rising behind the Earth -->
    <circle cx="452" cy="408" r="40" fill="#ffcc33"/>

    <!-- The Earth with its atmosphere -->
    <circle cx="300" cy="900" r="520" fill="#7fd0f0" opacity="0.45"/>
    <circle cx="300" cy="900" r="505" fill="url(#earth)"/>
    <path d="M 60 470 q 60 -40 120 -20 q 40 15 80 -5 q 30 -12 40 10 q -20 30 -70 35 q -60 5 -100 30 q -40 20 -70 10 z"
          fill="#3fa36b"/>
    <path d="M 360 440 q 40 -18 90 -8 q 30 8 60 -5 l 20 40 q -40 20 -90 15 q -50 -5 -80 -42 z" fill="#3fa36b"/>

    <!-- Line of sight from the satellite to the limb -->
    <line x1="318" y1="300" x2="150" y2="408" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 7" opacity="0.8"/>

    <!-- The satellite -->
    <g transform="rotate(-18 330 285)">
      <rect x="180" y="268" width="100" height="36" rx="3" fill="url(#panel)" stroke="#ffffff" stroke-width="3"/>
      <line x1="213" y1="268" x2="213" y2="304" stroke="#ffffff" stroke-width="2"/>
      <line x1="247" y1="268" x2="247" y2="304" stroke="#ffffff" stroke-width="2"/>
      <rect x="380" y="268" width="100" height="36" rx="3" fill="url(#panel)" stroke="#ffffff" stroke-width="3"/>
      <line x1="413" y1="268" x2="413" y2="304" stroke="#ffffff" stroke-width="2"/>
      <line x1="447" y1="268" x2="447" y2="304" stroke="#ffffff" stroke-width="2"/>
      <line x1="280" y1="286" x2="300" y2="286" stroke="#ffffff" stroke-width="4"/>
      <line x1="360" y1="286" x2="380" y2="286" stroke="#ffffff" stroke-width="4"/>
      <rect x="300" y="250" width="60" height="72" rx="4" fill="#e8b23a" stroke="#ffffff" stroke-width="3"/>
      <rect x="310" y="262" width="40" height="14" fill="#c48a1c"/>
      <circle cx="330" cy="300" r="12" fill="#1b1a3a" stroke="#ffffff" stroke-width="3"/>
      <line x1="330" y1="250" x2="330" y2="232" stroke="#ffffff" stroke-width="3"/>
      <path d="M 314 232 q 16 -16 32 0 z" fill="#ffffff"/>
    </g>
  </g>


  <!-- Lettering on the band: one rotated text element per letter, because Word does not draw textPath -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="middle">
    <text x="230.9" y="59.7" transform="rotate(-16.0 230.9 59.7)">B</text>
    <text x="254.3" y="54.2" transform="rotate(-10.5 254.3 54.2)">I</text>
    <text x="279.0" y="50.9" transform="rotate(-4.8 279.0 50.9)">G</text>
    <text x="311.0" y="50.2" transform="rotate(2.5 311.0 50.2)">S</text>
    <text x="341.8" y="53.5" transform="rotate(9.6 341.8 53.5)">A</text>
    <text x="371.0" y="60.3" transform="rotate(16.5 371.0 60.3)">T</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="21" fill="#f2a71b" text-anchor="middle">
    <text x="111.9" y="490.9" transform="rotate(44.6 111.9 490.9)">L</text>
    <text x="121.6" y="500.0" transform="rotate(41.7 121.6 500.0)">I</text>
    <text x="133.6" y="510.1" transform="rotate(38.4 133.6 510.1)">M</text>
    <text x="150.0" y="522.1" transform="rotate(34.0 150.0 522.1)">B</text>
    <text x="171.2" y="535.0" transform="rotate(28.7 171.2 535.0)">·</text>
    <text x="193.6" y="546.0" transform="rotate(23.4 193.6 546.0)">C</text>
    <text x="211.5" y="552.9" transform="rotate(19.3 211.5 552.9)">A</text>
    <text x="228.6" y="558.3" transform="rotate(15.4 228.6 558.3)">L</text>
    <text x="241.6" y="561.6" transform="rotate(12.6 241.6 561.6)">I</text>
    <text x="255.8" y="564.3" transform="rotate(9.5 255.8 564.3)">B</text>
    <text x="274.8" y="566.8" transform="rotate(5.4 274.8 566.8)">R</text>
    <text x="293.9" y="567.9" transform="rotate(1.3 293.9 567.9)">A</text>
    <text x="311.9" y="567.7" transform="rotate(-2.6 311.9 567.7)">T</text>
    <text x="325.2" y="566.8" transform="rotate(-5.4 325.2 566.8)">I</text>
    <text x="340.2" y="565.0" transform="rotate(-8.6 340.2 565.0)">O</text>
    <text x="359.6" y="561.3" transform="rotate(-12.8 359.6 561.3)">N</text>
    <text x="383.6" y="554.6" transform="rotate(-18.2 383.6 554.6)">·</text>
    <text x="407.9" y="545.3" transform="rotate(-23.7 407.9 545.3)">M</text>
    <text x="422.1" y="538.6" transform="rotate(-27.1 422.1 538.6)">I</text>
    <text x="434.3" y="531.9" transform="rotate(-30.1 434.3 531.9)">S</text>
    <text x="449.6" y="522.4" transform="rotate(-33.9 449.6 522.4)">S</text>
    <text x="460.9" y="514.3" transform="rotate(-36.9 460.9 514.3)">I</text>
    <text x="472.7" y="504.9" transform="rotate(-40.1 472.7 504.9)">O</text>
    <text x="487.3" y="491.7" transform="rotate(-44.3 487.3 491.7)">N</text>
  </g>
</svg>
