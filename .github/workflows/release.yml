# Publish a release on PyPI when a version tag (such as 1.2.0) is pushed.
#
# PyPI Trusted Publishing: on pypi.org, add a trusted publisher for the project (owner and repository of this
# GitHub repository, workflow "release.yml", environment "pypi"). No API token is stored.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # setuptools_scm takes the version from the tag
      - uses: astral-sh/setup-uv@v6
      - name: Build the sdist and the wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx2word/
    permissions:
      id-token: write               # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
