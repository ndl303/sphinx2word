# Read the Docs configuration: builds the HTML documentation in docs/ (docs/conf.py), which also builds the
# example document as Word and HTML for its downloads. Python comes from uv and uv.lock, with the docs group only.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz          # dot, for the graphviz diagrams in the example
  jobs:
    post_checkout:
      # setuptools_scm needs the tags to number the version
      - git fetch --unshallow --tags || true
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-default-groups --group docs

sphinx:
  configuration: docs/conf.py
